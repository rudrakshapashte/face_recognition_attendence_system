<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header><h1>Student Reports</h1><p>Registered Student Management</p></header>
<nav>
    <a href="/">Dashboard</a>
    <a href="/register">Register Student</a>
    <a href="/attendance">Attendance</a>
    <a class="active" href="/reports">Reports</a>
</nav>
<main>
<section class="table-box">
    <div class="toolbar">
        <div>
            <h2>Registered Students</h2>
            <p class="muted">Delete a student only if you no longer need their face data.</p>
        </div>
        <button class="button small" onclick="loadStudents()">Refresh</button>
    </div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Roll No</th><th>Registered At</th><th>Action</th></tr></thead>
            <tbody id="studentsBody"></tbody>
        </table>
    </div>
</section>
</main>
<script src="/static/js/app.js"></script>
<script>document.addEventListener("DOMContentLoaded", loadStudents);</script>
</body>
</html>
